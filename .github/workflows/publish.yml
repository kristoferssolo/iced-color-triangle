name: Publish
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version number in the format 1.2.3
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  metadata:
    name: Resolve release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and validate release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              version="$INPUT_VERSION"
          else
              version="${REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Version must be a valid SemVer value without a leading v"
              exit 1
          fi

          manifest_version="$(
              cargo metadata --no-deps --format-version 1 |
                  jq -r '.packages[] | select(.name == "iced-color-triangle") | .version'
          )"
          if [[ "$manifest_version" != "$version" ]]; then
              echo "::error::iced-color-triangle is version $manifest_version, not $version"
              exit 1
          fi

          {
              echo "tag=v$version"
              echo "version=$version"
          } >>"$GITHUB_OUTPUT"
  check:
    name: Release checks
    needs: metadata
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish to crates.io
    needs:
      - metadata
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify crate packaging
        run: cargo publish --dry-run --package iced-color-triangle
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish --package iced-color-triangle
  release:
    name: Create GitHub release
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: iced-color-triangle v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
