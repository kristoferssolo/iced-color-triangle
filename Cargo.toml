[package]
name = "iced-color-triangle"
version = "0.1.0"
edition = "2024"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
description = "A hue ring and triangle color selector for Iced"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["iced", "color", "picker", "widget"]
categories = ["gui"]

[dependencies]
iced_core = "0.14"
iced_widget = { version = "0.14", default-features = false, features = [
  "canvas",
] }
palette = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
claims = "0.8"
iced = { version = "0.14", default-features = false, features = [
  "canvas",
  "tiny-skia",
  "thread-pool",
  "wayland",
] }
iced_tiny_skia = { version = "0.14", default-features = false, features = [
  "geometry",
] }
rstest = "0.27"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
